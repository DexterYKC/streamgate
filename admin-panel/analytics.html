<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <link rel="icon" href="logo.svg" type="image/png">
  <title>StreamGate – Analytics</title>
  <link rel="stylesheet" href="style.css" />
  <style>
    /* SPÉCIFIQUE À CETTE PAGE */
    .page-analytics {
      max-width: 1200px;
      width: 100%;
      margin: 0 auto;
      padding: 90px 20px 40px;
    }

    @media(max-width:768px) {
      .page-analytics {
        padding: 80px 14px 30px;
      }

      .kpi-grid {
        grid-template-columns: repeat(auto-fit, minmax(160px, 1fr));
        gap: 14px;
      }

      .kpi {
        padding: 16px 14px;
        border-radius: 14px;
      }

      .kpi h2 {
        font-size: 22px;
      }

      table {
        font-size: 14px;
        overflow-x: auto;
        display: block;
        white-space: nowrap;
      }

      .card {
        padding: 18px;
      }
    }
  </style>
</head>

<body>

  <!-- NAVBAR -->
  <div class="topnav">
    <div class="nav-left">
      <div class="logo-badge">A</div>
      <span class="nav-title">StreamGate Admin</span>
    </div>

    <div class="nav-links">
      <a href="index.html" class="nav-link">Videos</a>
      <a href="categories.html" class="nav-link">Categories</a>
      <a href="users.html" class="nav-link">Users</a>
      <a href="analytics.html" class="nav-link active">Analytics</a>
      <a href="bots.html" class="nav-link">Bots</a>
      <a href="broadcast.html" class="nav-link">Broadcast</a>
      <button class="nav-logout-btn" onclick="logout()">Logout</button>
    </div>
  </div>

  <!-- PAGE -->
  <div class="page page-analytics">

    <div class="page-header">
      <h1>Analytics</h1>
      <p class="subtitle">Overview of subscriptions, revenue and recent activity</p>
    </div>

    <!-- KPI GRID -->
    <div class="kpi-grid">
      <div class="kpi">
        <h2 id="statTotalSubs">0</h2>
        <p>Total Subscribers</p>
      </div>

      <div class="kpi">
        <h2 id="statActiveSubs">0</h2>
        <p>Active Subscribers</p>
      </div>

      <div class="kpi">
        <h2 id="statRevenue">$0.00</h2>
        <p>Total Revenue</p>
      </div>

      <div class="kpi">
        <h2 id="statPlans">–</h2>
        <p>Plans</p>
      </div>
    </div>

    <!-- PAYMENT TABLE -->
    <div class="card" style="margin-top: 24px;">
      <div class="card-header">
        <h2>Last payments</h2>
      </div>

      <table>
        <thead>
          <tr>
            <th>Date</th>
            <th>Telegram ID</th>
            <th>Plan</th>
            <th>Amount</th>
            <th>Status</th>
            <th>Payment ID</th>
          </tr>
        </thead>
        <tbody id="paymentsTableBody">
          <tr><td colspan="6">Loading…</td></tr>
        </tbody>
      </table>
    </div>

  </div>

<script>
function logout() {
  localStorage.removeItem("ADMIN_KEY");
  window.location.href = "login.html";
}
</script>

<script src="admin-guard.js" defer></script>
<script src="analytics.js"></script>
</body>
</html>
